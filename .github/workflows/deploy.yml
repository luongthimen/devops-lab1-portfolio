name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Lấy toàn bộ lịch sử Git để Lighthouse đọc được commit hash
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate HTML
        run: |
          echo "Checking index.html exists..."
          if [ -f "index.html" ]; then
            echo "index.html found!"
            echo "File size: $(wc -c < index.html) bytes"
          else
            echo "index.html NOT found!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline"

      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://luongthimen.github.io/devops-lab1-portfolio/
          temporaryPublicStorage: true